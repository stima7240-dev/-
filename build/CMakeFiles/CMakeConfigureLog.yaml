        lambda[-]             Улучшенная поддержка лямбда-выражений за счет более нового обработчика
                              (включено по умолчанию в C++20 или более поздних версиях, подразумевается /permissive-)
        tlsGuards[-]          - создание проверок инициализации TLS-переменных во время выполнения (по умолчанию включено)
        zeroSizeArrayNew[-]   вызов элемента new/delete для массивов объектов нулевого размера (по умолчанию включено)
        static_assert[-]      строгая обработка static_assert (включена по умолчанию в C++20 или более поздних версиях,
