        sizedDealloc[-]       включить освобождение глобального размера C++14
                              функции (по умолчанию включены)
        throwingNew[-]        предполагать исключение оператора new при сбое (отключено по умолчанию)
        referenceBinding[-]   временное значение не будет привязано к неконстантному
                              Ссылка на lvalue (включено по умолчанию в C++20 или более поздних версиях, подразумевается /permissive-)
        twoPhase-             отключить двухэтапный поиск имен
        ternary[-]            применять правила из C++11 для условного оператора
                              (включено по умолчанию в C++20 или более поздних версиях, подразумевается /permissive-)
        noexceptTypes[-]      применять правила noexcept C++17 (включено по умолчанию в C++17 и более поздних версиях)
        alignedNew[-]         включить выравнивание C++17 для динамически выделяемых объектов (по умолчанию включено)
        hiddenFriend[-]       применять стандартные правила скрытого друга C++
                              (включено по умолчанию в C++20 или более поздних версиях, подразумевается /permissive-)
        externC[-]            применить стандартные правила C++ для функций "extern "C""
