        gotoScope[-]          не может перейти после инициализации переменной (подразумеваемой параметром /permissive-)
        templateScope[-]      применяет стандартные правила удаленного управления параметрами шаблона C++
        enumTypes[-]          включить базовые типы перечислений C++ Стандартный (по умолчанию отключены)
        enumEncoding[-]        правильно кодировать использование перечисления в качестве аргумента шаблона, не являющегося
